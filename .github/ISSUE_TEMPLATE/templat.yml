name: Kirim templat
description: Sumbangkan karya visual (ilustrasi, foto, atau desain) untuk kampanye kesadaran karhutla
title: "[Templat] "
labels: ["templat"]
body:
  - type: markdown
    attributes:
      value: |
        Ilustrator, fotografer, dan desainer grafis dipersilakan menyumbangkan karya untuk Instagram Story, unggahan, atau layar desktop. Ukuran dan rasio bebas. Kiriman bersifat publik dan **ditinjau pemelihara terlebih dahulu**; hanya yang disetujui yang dimuat pada halaman Templat Story. Jangan mencantumkan data pribadi.
  - type: input
    id: judul
    attributes:
      label: Judul templat
    validations:
      required: true
  - type: input
    id: kreator
    attributes:
      label: Nama kreator
      description: Nama atau nama samaran yang ditampilkan sebagai kredit.
    validations:
      required: true
  - type: textarea
    id: deskripsi
    attributes:
      label: Deskripsi
      description: Opsional. Satu deskripsi singkat untuk karya atau seri ini (maksimal 400 karakter).
  - type: input
    id: tautan
    attributes:
      label: Tautan portofolio atau akun media sosial
      description: Opsional. Ditampilkan sebagai tautan kredit (harus diawali https://).
      placeholder: https://
  - type: textarea
    id: gambar
    attributes:
      label: Gambar
      description: Seret berkas gambar ke kotak ini (PNG, JPG, WebP, atau GIF; maksimal 12 MB per berkas, hingga 10 berkas; GIF animasi dianjurkan maksimal 5 MB, dan di galeri tampil diam lebih dulu lalu diputar saat tombol GIF diketuk). Jika lebih dari satu, kumpulan gambar ditampilkan sebagai satu seri yang bisa digeser, berurutan seperti yang Anda unggah; gambar pertama menjadi sampul. Format SVG tidak diterima.
    validations:
      required: true
  - type: checkboxes
    id: pernyataan
    attributes:
      label: Pernyataan
      options:
        - label: Karya ini buatan saya sendiri (atau saya berhak penuh menyumbangkannya), dan tidak memuat merek, karya, atau wajah orang lain tanpa izin.
          required: true
        - label: Saya mengizinkan pengunjung memakai, mengunduh, dan membagikan karya ini secara gratis untuk kampanye kesadaran karhutla dengan mencantumkan nama saya sebagai kredit.
          required: true
