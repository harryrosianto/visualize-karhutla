name: Setujui templat komunitas

# Berjalan hanya ketika pemelihara memasang label "setujui-templat" pada isu bertanda "templat".
# Pelabelan memerlukan akses tulis, jadi pengirim biasa tidak dapat memicu alur ini.
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: approve-template
  cancel-in-progress: false

jobs:
  approve:
    if: github.event.label.name == 'setujui-templat' && contains(github.event.issue.labels.*.name, 'templat')
    runs-on: ubuntu-latest
    steps:
      - name: Pastikan pemberi label berhak (admin, maintain, atau write)
        env:
          GH_TOKEN: ${{ github.token }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          perm=$(gh api "repos/${{ github.repository }}/collaborators/$SENDER/permission" --jq .permission)
          echo "izin: $perm"
          case "$perm" in admin|maintain|write) ;; *) echo "Pemberi label tidak berhak"; exit 1 ;; esac
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Proses gambar kiriman
        id: proses
        env:
          # Isi isu diteruskan lewat lingkungan, tidak pernah disisipkan ke perintah shell.
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: npx tsx scripts/approve-template.ts
      - name: Commit dan dorong ke main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/community src/content/communityTemplates.json
          git commit -m "Tambah templat komunitas dari isu #${{ github.event.issue.number }}"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Picu deploy, beri tahu pengirim, dan tutup isu
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --ref main
          gh issue comment ${{ github.event.issue.number }} --body "Terima kasih. Templat Anda disetujui dan akan tampil pada halaman Templat Story setelah situs selesai diperbarui (beberapa menit)."
          gh issue close ${{ github.event.issue.number }} --reason completed
