name: Deploy ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Satu deploy dalam satu waktu. Deploy yang sedang berjalan dibiarkan selesai (tidak dibatalkan di tengah jalan);
# bila ada beberapa run menunggu, hanya yang terbaru yang dijalankan sehingga situs selalu memuat commit terakhir.
# Run perantara yang digantikan tampil "dibatalkan" dengan keterangan "higher priority waiting request": itu normal, bukan kegagalan.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Periksa konfigurasi formulir kirim karya
        run: |
          echo "Variabel TURNSTILE_SITEKEY terisi: ${{ vars.TURNSTILE_SITEKEY != '' }}"
          echo "Secret TURNSTILE_SITEKEY terisi: ${{ secrets.TURNSTILE_SITEKEY != '' }}"
      - run: npm run build
        env:
          # Kunci situs Turnstile (publik) untuk formulir kirim karya; kosong = formulir langsung disembunyikan.
          VITE_TURNSTILE_SITEKEY: ${{ vars.TURNSTILE_SITEKEY || secrets.TURNSTILE_SITEKEY }}
          # Terisi otomatis: https://<akun>.github.io/<repositori> dan base /<repositori>/.
          # Untuk domain khusus, buat variabel repositori SITE_URL (alamat publik) dan SITE_BASE (kosongkan).
          VITE_SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          VITE_BASE: ${{ vars.SITE_BASE || (vars.SITE_URL && '/' || format('/{0}/', github.event.repository.name)) }}
      # GitHub Pages tidak mendukung _redirects; 404.html menjadi cadangan routing sisi klien
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
