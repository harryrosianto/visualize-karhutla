name: Deploy ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Atur di Settings > Secrets and variables > Actions > Variables:
          # SITE_URL  = alamat publik tanpa garis miring akhir, mis. https://nama.github.io/visualize-karhutla
          # SITE_BASE = /visualize-karhutla/ (kosongkan bila memakai domain khusus)
          VITE_SITE_URL: ${{ vars.SITE_URL }}
          VITE_BASE: ${{ vars.SITE_BASE }}
      # GitHub Pages tidak mendukung _redirects; 404.html menjadi cadangan routing sisi klien
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
